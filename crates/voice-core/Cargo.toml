[package]
name = "voice-core"
version = "0.0.1"
edition = "2021"
[dependencies]
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
serde_json = "1"

[dev-dependencies]
futures-util = "0.3"

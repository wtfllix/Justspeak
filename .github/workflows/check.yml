name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: npm ci
      - run: cargo check --locked --workspace
      - run: npm run tauri -w @xxspeak/desktop -- build --no-bundle
      - name: Prepare Windows portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-x64 | Out-Null
          Copy-Item target/release/xxspeak-desktop.exe dist/windows-x64/xxspeak.exe
          Copy-Item docs/WINDOWS-PORTABLE.md dist/windows-x64/README.md
          $artifactHash = (Get-FileHash dist/windows-x64/xxspeak.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactHash  xxspeak.exe" | Set-Content dist/windows-x64/SHA256SUMS.txt -Encoding ascii
          $env:GITHUB_SHA | Set-Content dist/windows-x64/SOURCE_COMMIT.txt -Encoding ascii
      - name: Check Windows executable stays running
        shell: pwsh
        run: |
          $clientProcess = Start-Process -FilePath (Resolve-Path dist/windows-x64/xxspeak.exe) -PassThru
          try {
            Start-Sleep -Seconds 5
            $clientProcess.Refresh()
            if ($clientProcess.HasExited) {
              throw "Windows executable exited during startup (code $($clientProcess.ExitCode))"
            }
          } finally {
            if (-not $clientProcess.HasExited) {
              Stop-Process -Id $clientProcess.Id -Force
            }
          }
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: xxspeak-m0-windows-x64
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
